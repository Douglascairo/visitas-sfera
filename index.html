<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Sfera · Super em Ação</title>
  <link rel="icon" type="image/png" href="img/sfera-logo.png?v=1023">
  <link rel="apple-touch-icon" href="img/icon-192.png?v=1023">
  <link rel="manifest" href="manifest.json?v=1023">
  <meta name="theme-color" content="#0E2A86">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Super em Ação">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="css/style.css?v=20261023b">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</head>
<body>
<div class="login-wrap">
  <div class="login-shell">
    <aside class="login-brand">
      <span class="brand-logo-wrap"><img src="img/sfera-logo.png?v=1023" alt="Sfera Multifranquias"></span>
      <p class="brand-tag">Um só portal para a supervisão Sfera.</p>
      <img class="login-mascote" src="img/mascote-sfera.png?v=1023" alt="Mascote Sfera" onerror="this.style.display='none'">
    </aside>

    <div class="login-box">
      <div class="login-logo">
        <div class="app-name">Super em Ação</div>
        <p>Supervisão orientada por inteligência de dados</p>
      </div>

      <div id="step-email">
        <p class="login-title">Bem-vinda! Faça seu login</p>
        <div class="form-group">
          <label class="form-label" for="email-input">E-mail de acesso</label>
          <input type="email" id="email-input" class="form-control" placeholder="seu@email.com" autocomplete="email">
        </div>
        <button class="btn btn-primary btn-full" onclick="checkEmail()">Entrar</button>
      </div>

      <div id="step-loading" style="display:none" class="loader">
        <div class="spinner"></div>
        <p>Verificando...</p>
      </div>

      <div id="step-erro" style="display:none">
        <p style="color:var(--danger);margin-bottom:16px;text-align:center;font-weight:600;">E-mail não encontrado no sistema.</p>
        <button class="btn btn-secondary btn-full" onclick="voltarLogin()">Tentar novamente</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase.js"></script>
<script>
  const emailInput = document.getElementById('email-input');
  emailInput.addEventListener('keydown', e => { if (e.key === 'Enter') checkEmail(); });

  async function checkEmail() {
    const email = emailInput.value.trim().toLowerCase();
    if (!email) return showToast('Digite seu e-mail', 'error');

    // Coordenação / Diretoria
    const COORDENADORES = {
      'douglas.cairo@franquiasboticario.com': 'Douglas Cairo',
      'leonardo.sobral@sferamultifranquias.com': 'Leonardo Sobral'
    };
    if (COORDENADORES[email]) {
      sessionStorage.setItem('usuario', JSON.stringify({ tipo: 'coordenador', nome: COORDENADORES[email], email }));
      window.location.href = 'coordenador.html';
      return;
    }

    show('step-loading');
    hide('step-email');

    const { data, error } = await db.from('supervisoras').select('*').eq('email', email).single();

    if (error || !data) {
      show('step-erro');
      hide('step-loading');
      return;
    }

    sessionStorage.setItem('usuario', JSON.stringify({ tipo: 'supervisora', ...data }));
    window.location.href = 'app.html';
  }

  function voltarLogin() {
    show('step-email');
    hide('step-erro');
    emailInput.value = '';
    emailInput.focus();
  }

  function show(id) { document.getElementById(id).style.display = ''; }
  function hide(id) { document.getElementById(id).style.display = 'none'; }

  function showToast(msg, tipo = '') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show ' + tipo;
    setTimeout(() => t.className = 'toast', 2500);
  }
</script>
</body>
</html>
